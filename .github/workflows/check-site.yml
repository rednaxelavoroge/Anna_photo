# Проверка живого сайта и архива заказчицы с машины GitHub.
#
# Зачем: из песочницы, где идёт правка кода, ни annamanasaryan.com, ни
# Яндекс.Диск не открываются — сеть закрыта. У машины сборки интернет есть,
# поэтому проверка живёт здесь и запускается кнопкой. Ничего не меняет,
# только читает и печатает в лог:
#
#   1. Полный список файлов в публичной папке Яндекс.Диска (имена, размеры,
#      по папкам) — чтобы сверить с тем, что лежит в репозитории.
#   2. Обход живого сайта: все страницы из sitemap.xml, из них все ссылки на
#      фотографии, ролики и скрипты, и код ответа на каждую.

name: Проверить живой сайт и архив

on:
  # Кнопка работает только для процессов, которые есть в главной ветке; этот
  # живёт в рабочей, поэтому запускается ещё и при открытии pull request.
  pull_request:
  workflow_dispatch:
    inputs:
      yandex_public_url:
        description: Публичная ссылка на папку Яндекс.Диска
        default: https://disk.yandex.ru/d/Jgm7EDdj2WLl_A
      site:
        description: Адрес сайта
        default: https://annamanasaryan.com

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Список файлов в архиве Яндекс.Диска
        env:
          PUBLIC_URL: ${{ inputs.yandex_public_url || 'https://disk.yandex.ru/d/Jgm7EDdj2WLl_A' }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.parse, urllib.request
          key = os.environ["PUBLIC_URL"]
          api = "https://cloud-api.yandex.net/v1/disk/public/resources"
          def listing(path):
              items, offset = [], 0
              while True:
                  q = {"public_key": key, "limit": 1000, "offset": offset}
                  if path: q["path"] = path
                  with urllib.request.urlopen(api + "?" + urllib.parse.urlencode(q), timeout=60) as r:
                      d = json.load(r)
                  emb = d.get("_embedded", {})
                  items += emb.get("items", [])
                  offset += 1000
                  if offset >= emb.get("total", 0): break
              return items
          folders = [""]
          rows = []
          while folders:
              path = folders.pop(0)
              for it in listing(path):
                  p = (path + "/" + it["name"]) if path else "/" + it["name"]
                  if it["type"] == "dir":
                      folders.append(p)
                  else:
                      rows.append((p, it.get("size", 0)))
          rows.sort()
          from collections import Counter
          by_dir, size_dir = Counter(), Counter()
          for p, s in rows:
              d = p.rsplit("/", 1)[0] or "/"
              by_dir[d] += 1; size_dir[d] += s
          print("=== ПАПКИ АРХИВА (файлов, МБ) ===")
          for d in sorted(by_dir):
              print(f"{by_dir[d]:5d}  {size_dir[d]/1e6:8.1f}  {d}")
          print(f"ВСЕГО файлов: {len(rows)}, {sum(s for _, s in rows)/1e6:.0f} МБ")
          print("=== ВСЕ ФАЙЛЫ АРХИВА ===")
          for p, s in rows:
              print(f"{s:>10}  {p}")
          EOF

      - name: Что лежит в репозитории (для сверки)
        run: |
          echo "=== ПАПКИ РЕПОЗИТОРИЯ (файлов) ==="
          for d in public/photos/*/ public/videos/; do
            printf "%5d  %s\n" "$(find "$d" -type f | wc -l)" "$d"
          done
          echo "=== ВСЕ ФАЙЛЫ РЕПОЗИТОРИЯ ==="
          find public/photos public/videos -type f | sort

      - name: Обход живого сайта
        env:
          SITE: ${{ inputs.site || 'https://annamanasaryan.com' }}
        run: |
          python3 - <<'EOF'
          import os, re, sys, html, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          site = os.environ["SITE"].rstrip("/")
          def get(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={"User-Agent": "site-check"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read() if method == "GET" else b""
                      return r.status, body, r.headers.get("Content-Length")
              except urllib.error.HTTPError as e:
                  return e.code, b"", None
              except Exception as e:
                  return f"ERR {type(e).__name__}", b"", None
          st, body, _ = get(site + "/sitemap.xml")
          print("sitemap.xml:", st)
          pages = re.findall(r"<loc>([^<]+)</loc>", body.decode("utf8", "ignore"))
          pages = [p.replace("https://www.", "https://") for p in pages]
          if not pages: pages = [site + "/"]
          print("страниц в sitemap:", len(pages))
          assets = {}
          print("=== СТРАНИЦЫ ===")
          for p in pages:
              st, body, _ = get(p)
              text = body.decode("utf8", "ignore")
              refs = set()
              for m in re.findall(r'(?:src|href|poster)="([^"]+)"', text):
                  u = html.unescape(m).split("?")[0].split("#")[0]
                  if u.startswith("/") and not u.startswith("//") and re.search(r"\.(jpe?g|png|webp|mp4|mov|webm|js|css)$", u, re.I):
                      refs.add(u)
              n_img = len(re.findall(r"<img ", text)); n_vid = len(re.findall(r"<video", text))
              print(f"{st}  {len(body):>8} байт  img={n_img:<4} video={n_vid:<3} media-ссылок={len(refs):<4} {p}")
              for u in refs: assets.setdefault(u, set()).add(p)
          print("=== ФАЙЛЫ, НА КОТОРЫЕ ССЫЛАЕТСЯ САЙТ ===", len(assets))
          def head(u):
              st, _, cl = get(site + urllib.parse.quote(u), "HEAD")
              return u, st, cl
          with ThreadPoolExecutor(16) as ex:
              results = list(ex.map(head, sorted(assets)))
          bad = [(u, st) for u, st, _ in results if st != 200]
          print("ответили 200:", len(results) - len(bad), " не 200:", len(bad))
          for u, st in bad:
              print("  БИТАЯ:", st, u, " ← со страниц:", ", ".join(sorted(assets[u]))[:200])
          from collections import Counter
          dirs = Counter(u.rsplit("/", 1)[0] for u, st, _ in results if st == 200 and u.startswith("/photos"))
          print("=== ПАПКИ ФОТО НА ЖИВОМ САЙТЕ (файлов, на которые есть ссылки) ===")
          for d in sorted(dirs): print(f"{dirs[d]:5d}  {d}")
          print("=== ГЛАВНАЯ: обложки разделов ===")
          st, body, _ = get(site + "/")
          for m in re.findall(r'<img[^>]+src="([^"]+)"', body.decode("utf8", "ignore")):
              print("  ", html.unescape(m))
          print("=== ПРИМЕТЫ ВЕРСИИ ===")
          st, body, _ = get(site + "/training/")
          t = body.decode("utf8", "ignore")
          print("training: masterclass-2015-1.mp4 в HTML:", "masterclass-2015-1.mp4" in t, "; кириллическое имя ролика:", "Мастер-класс-2015" in t)
          st, body, _ = get(site + "/about/")
          t = body.decode("utf8", "ignore")
          print("about: раздел «Фотоархив»:", "Фотоархив" in t, "; служебный заголовок «без повтора ради колонки»:", "без повтора ради колонки" in t)
          for u in ["/photos/about/Привет.docx", "/photos/about/Манасарян Анна Эдвардовна  07.docx", "/photos/bloom/fiori-1.jpg", "/photos/blooming/fiori-1.jpg", "/photos/product/gioielli-1.jpg", "/photos/objects/gioielli-1.jpg", "/photos/individual/adult-30-3.jpg"]:
              print(f"  {head(u)[1]}  {u}")
          print("ИТОГ: битых ссылок на живом сайте:", len(bad))
          EOF
