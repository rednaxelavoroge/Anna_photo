# Выкладка панели на хостинг заказчицы.
#
# Зачем. Панель живёт на Vercel, а он в России придушен: заказчица заходит
# в неё только через ВПН и жалуется на тормоза. Сам сайт мы по этой же
# причине уже отдаём с её хостинга — теперь туда же переезжает панель.
# Заодно пропадает предел в 3,5 МБ на тело запроса: это было ограничение
# Vercel, а не наше.
#
# Vercel при этом остаётся рабочим запасным входом. Если на хостинге что-то
# пойдёт не так, заказчица заходит по-старому и ничего не теряет.
#
# Что уезжает. Сборка «standalone»: маленький сервер плюс ровно те
# зависимости, которые нужны в работе. `npm install` на хостинге не нужен —
# его там и не запустить.
#
# Чего НЕ уезжает: фотографии каталога. Они уже лежат на сайте, и панель
# берёт их оттуда — адрес задан в NEXT_PUBLIC_MEDIA_BASE.
#
# Этот процесс трогает ТОЛЬКО папку панели. Выкладка самого сайта живёт
# отдельно и здесь не участвует.

name: Выложить панель на хостинг

on:
  # Только вручную кнопкой: панель обновляется реже сайта, и лишний раз
  # дёргать её перезапуском во время работы заказчицы незачем.
  workflow_dispatch:
  # Кнопка в Actions показывается только с ветки по умолчанию, поэтому там
  # лежит короткий файл-вызов, а вся работа — здесь. Так две копии не
  # разъезжаются: правки нужны только в этом файле.
  workflow_call:

concurrency:
  group: deploy-panel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Ветка задана прямо здесь, а не берётся из той, с которой нажали
      # кнопку. Настоящий сайт и панель живут в рабочей ветке, а кнопка
      # запуска показывается только с главной, и она отстаёт. Без этой
      # строки нажатие с главной собрало бы старый код и увезло на хостинг
      # нерабочую панель.
      - uses: actions/checkout@v4
        with:
          ref: cursor/namecheap-static-f40b

      - uses: actions/setup-node@v4
        with:
          # Та же версия, что выбрана в cPanel у приложения Node.
          node-version: 22
          cache: npm

      - name: Проверить, заданы ли доступы
        id: check
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ]; then
            echo "Секрет FTP_HOST не задан — выкладка пропущена."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить зависимости
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Собрать панель
        if: steps.check.outputs.ready == 'true'
        env:
          PANEL_BUILD: "1"
          # Откуда панель берёт фотографии. NEXT_PUBLIC_* вшивается на этапе
          # сборки, поэтому задаётся здесь, а не только в cPanel.
          NEXT_PUBLIC_MEDIA_BASE: ${{ secrets.PANEL_MEDIA_BASE || 'https://annamanasaryan.com' }}
        run: npm run build

      - name: Собрать папку для отправки
        if: steps.check.outputs.ready == 'true'
        run: |
          set -e
          rm -rf panel-dist
          cp -r .next/standalone panel-dist

          # Статика сборки лежит отдельно — сервер ждёт её внутри.
          mkdir -p panel-dist/.next
          cp -r .next/static panel-dist/.next/static

          # Из public оставляем только шрифты и значок: остальное — каталог,
          # он и так на сайте.
          rm -rf panel-dist/public
          mkdir -p panel-dist/public
          cp -r public/fonts panel-dist/public/fonts
          cp public/favicon.ico panel-dist/public/ 2>/dev/null || true

          # Инструменты сборки в работе не нужны, а место занимают.
          rm -rf panel-dist/node_modules/typescript panel-dist/node_modules/@types

          # Хостинг запускает файл с этим именем — он просто зовёт сервер сборки.
          cat > panel-dist/app.js <<'JS'
          // Точка входа для хостинга: Passenger запускает именно этот файл.
          // Порт он передаёт сам, сборке остаётся его прочитать.
          process.env.HOSTNAME = process.env.HOSTNAME || "127.0.0.1";
          require("./server.js");
          JS

          # Папка панели лежит внутри public_html, то есть внутри папки сайта,
          # и иначе её содержимое отдавалось бы в интернет. Приложение
          # запускает хостинг — ему этот запрет не мешает, а посторонним
          # закрывает всё.
          cat > panel-dist/.htaccess <<'HT'
          Require all denied
          HT

          echo "Размер: $(du -sh panel-dist | cut -f1), файлов: $(find panel-dist -type f | wc -l)"

      - name: Залить панель на хостинг
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          # Отдельный доступ, если заведён: FTP сайта может быть заперт
          # в папке другого домена и до public_html не дотягиваться.
          FTP_USER: ${{ secrets.PANEL_FTP_USER || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.PANEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          # Папка приложения на хостинге — та же, что вписана в cPanel в поле
          # «Application root», но записанная от корня FTP-доступа. Если секрет
          # не задан, папка ищется перебором — см. ниже.
          PANEL_DIR: ${{ secrets.FTP_PANEL_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Заходит в указанную папку и перечисляет, что в ней лежит.
          # Молчит, если папки нет или войти в неё не вышло.
          listing() {
            lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP 2>/dev/null
              set ssl:verify-certificate no
              set ftp:ssl-allow yes
              set cmd:fail-exit yes
              cd "$1"
              cls -1
              bye
          LFTP
          }

          if [ -n "$PANEL_DIR" ]; then
            echo "Папка панели задана секретом FTP_PANEL_DIR."
          else
            # На этом аккаунте cPanel несколько сайтов, и FTP-логин попадает
            # то в общий корень, то сразу внутрь папки одного из доменов.
            # Поэтому папку сайта ищем перебором.
            #
            # Мало убедиться, что папка открылась: у соседнего сайта корень
            # устроен так же, и панель молча уехала бы к нему. Поэтому папка
            # обязана предъявить приметы именно этого сайта — index.html
            # и раздел phototour. Ошибиться на этом месте дорого: ниже
            # работает mirror с --delete.
            echo "Секрет FTP_PANEL_DIR не задан, ищу папку сайта."
            for candidate in \
              "." \
              "public_html" \
              "../public_html" \
              "../../public_html" \
              "/home/annaclvt/public_html"
            do
              found="$(listing "$candidate" || true)"
              if [ -z "$found" ]; then
                echo "  $candidate — не открылась"
                continue
              fi
              if ! printf '%s\n' "$found" | grep -qE '^index\.html/?$'; then
                echo "  $candidate — открылась, но это не корень сайта"
                continue
              fi
              if ! printf '%s\n' "$found" | grep -qE '^phototour/?$'; then
                echo "  $candidate — это корень чужого сайта, не annamanasaryan.com"
                continue
              fi
              echo "  $candidate — подходит: это корень annamanasaryan.com"
              PANEL_DIR="$candidate/admin-panel"
              break
            done
          fi

          if [ -z "$PANEL_DIR" ]; then
            echo "Не нашёл папку сайта annamanasaryan.com на хостинге."
            echo "Либо у FTP-учётки нет доступа к public_html — тогда заведите"
            echo "в cPanel → FTP Accounts отдельную учётку с корнем в"
            echo "public_html и положите её в секреты PANEL_FTP_USER и"
            echo "PANEL_FTP_PASSWORD, — либо впишите путь до папки панели"
            echo "прямо в секрет FTP_PANEL_DIR."
            exit 1
          fi

          # Замок. Ниже стоит mirror с --delete: он вычищает из папки всё,
          # чего нет в сборке. Для собственной папки панели это правильно, но
          # если сюда по ошибке попадёт корень сайта, тем же движением снесёт
          # и сайт. Поэтому опасные значения не пропускаем вовсе.
          case "$PANEL_DIR" in
            ""|"."|"/"|"./"|".."|"../")
              echo "Папка панели задана как «$PANEL_DIR» — это корень. Остановлено."
              exit 1
              ;;
          esac
          # Значение теперь путь, а не одно слово, поэтому смотрим и на хвост:
          # «что-нибудь/public_html» так же опасно, как просто «public_html».
          LAST="${PANEL_DIR##*/}"
          case "$LAST" in
            ""|"."|".."|"public_html"|"www"|"httpdocs"|"home"|"annamanasaryan.com"|"annamanasaryan.art")
              echo "Папка панели заканчивается на «$LAST» — это корень сайта. Остановлено."
              exit 1
              ;;
          esac
          if [ "${#LAST}" -lt 4 ]; then
            echo "Слишком короткое имя папки: «$LAST». Остановлено."
            exit 1
          fi

          echo "Заливаю панель в $PANEL_DIR на $FTP_HOST"
          echo "PANEL_DIR=$PANEL_DIR" >> "$GITHUB_ENV"
          # --delete здесь можно и нужно: это наша собственная папка, чужого
          # в ней нет, а старые куски сборки только мешают.
          # Исключение — tmp: там хостинг держит свою служебную метку.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set cmd:fail-exit yes
            mirror -R --delete --parallel=4 --exclude-glob tmp/ panel-dist "$PANEL_DIR"
            bye
          LFTP

      - name: Перезапустить панель
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.PANEL_FTP_USER || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.PANEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          set -e
          # Хостинг перезапускает приложение, когда меняется этот файл.
          date > restart.txt

          # Папку создаём отдельно и без строгого режима. У lftp «mkdir -p»
          # не означает «молчи, если уже есть»: со второй выкладки он честно
          # отвечает «File exists», а в строгом режиме это валит весь шаг —
          # ровно так первое обновление панели и не доехало до перезапуска.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP || true
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            mkdir -p "$PANEL_DIR/tmp"
            bye
          LFTP

          # А вот сама метка обязана лечь: без неё хостинг не перезапустит
          # приложение, оно останется на прежней сборке, и выкладка молча
          # ничего не изменит.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set cmd:fail-exit yes
            put -O "$PANEL_DIR/tmp" restart.txt
            bye
          LFTP
          echo "Панель перезапущена."
