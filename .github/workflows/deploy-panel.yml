# Кнопка запуска выкладки панели.
#
# Кнопка показывается в Actions только с ветки по умолчанию, а настоящий
# сайт и панель живут в рабочей ветке cursor/namecheap-static-f40b. Поэтому
# здесь лежит только вызов, а сам процесс — там, в одном экземпляре: две
# копии рано или поздно разъедутся, и панель уедет на хостинг старым
# процессом, молча и без единой ошибки.
#
# Чтобы посмотреть, что именно делает выкладка, откройте файл
# .github/workflows/deploy-panel.yml в ветке cursor/namecheap-static-f40b.

name: Выложить панель на хостинг

on:
  # Только вручную кнопкой: панель обновляется реже сайта, и лишний раз
  # дёргать её перезапуском во время работы заказчицы незачем.
  workflow_dispatch:

jobs:
  deploy:
    uses: rednaxelavoroge/Anna_photo/.github/workflows/deploy-panel.yml@cursor/namecheap-static-f40b
    # Доступы к хостингу лежат в секретах репозитория; вызываемый процесс
    # без них ничего не сделает и честно об этом напишет.
    secrets: inherit
