# Публикация самого сайта annamanasaryan.com на хостинге заказчицы.
#
# Зачем этот файл появился. Выкладка фотосайта раньше жила в репозитории
# сайта свечей (deploy-photo-com.yml) и запускалась только кнопкой. Ни один
# из трёх её запусков не дошёл до конца: у той FTP-учётки не было доступа
# к папке фотосайта. То есть Анна сохраняла из панели, а на сайте ничего
# не менялось — при том что панель обещает ей «обновится через несколько
# минут». Здесь это обещание становится правдой.
#
# Почему сама, а не кнопкой. Выгрузка сайта — 7 МБ и полторы сотни файлов,
# минуты работы. Заставлять кого-то нажимать кнопку после каждой правки
# заказчицы незачем, а забыть нажать — легко.
#
# Панели это не касается: она живёт своей жизнью и обновляется отдельным
# процессом deploy-panel.yml по кнопке.

name: Выложить сайт на хостинг

on:
  push:
    branches:
      - cursor/namecheap-static-f40b
    paths-ignore:
      # Записи и процессы на сайт не попадают — гонять сборку из-за них незачем.
      - "docs/**"
      - ".github/**"
      - "README.md"
  # На случай, когда нужно выложить тот же код заново.
  workflow_dispatch:
  # Кнопка в Actions показывается только с ветки по умолчанию, поэтому там
  # лежит короткий файл-вызов, а вся работа — здесь, в одном экземпляре.
  workflow_call:

concurrency:
  group: deploy-site
  # Заказчица часто сохраняет несколько раз подряд. Промежуточные выкладки
  # не нужны — важна последняя.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Ветка задана явно, а не берётся из той, с которой запустили. Кнопка
      # запуска живёт в главной ветке, а она отстаёт от рабочей: без этой
      # строки нажатие кнопки собирает старый код — а то и не собирает
      # вовсе, как случилось при первой проверке.
      - uses: actions/checkout@v4
        with:
          ref: cursor/namecheap-static-f40b

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверить, заданы ли доступы
        id: check
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ]; then
            echo "Секрет FTP_HOST не задан — выкладка пропущена."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить зависимости
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Собрать сайт папкой готовых файлов
        if: steps.check.outputs.ready == 'true'
        run: npm run export:namecheap

      - name: Проверить, что собралось именно то
        if: steps.check.outputs.ready == 'true'
        run: |
          set -e
          # Пустая или наполовину собранная выгрузка, залитая поверх рабочего
          # сайта, — это сломанный сайт. Дешевле остановиться здесь.
          test -f out/index.html
          test -f out/.htaccess
          test -d out/portfolio
          echo "Готово к отправке: $(du -sh out | cut -f1), файлов: $(find out -type f | wc -l)"

      - name: Залить сайт на хостинг
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.PANEL_FTP_USER || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.PANEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          listing() {
            lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP 2>/dev/null
              set ssl:verify-certificate no
              set ftp:ssl-allow yes
              set cmd:fail-exit yes
              cd "$1"
              cls -1
              bye
          LFTP
          }

          # На этом аккаунте cPanel живут два сайта. Залить фотосайт поверх
          # каталога свечей — это уничтожить чужой сайт, поэтому папка обязана
          # предъявить приметы: своя (index.html или папка панели) и заведомо
          # не чужая (catalog + brand — это свечи).
          TARGET=""
          for candidate in \
            "." \
            "public_html" \
            "../public_html" \
            "../../public_html" \
            "/home/annaclvt/public_html"
          do
            found="$(listing "$candidate" || true)"
            if [ -z "$found" ]; then
              echo "  $candidate — не открылась"
              continue
            fi
            if printf '%s\n' "$found" | grep -qE '^catalog/?$' \
               && printf '%s\n' "$found" | grep -qE '^brand/?$'; then
              echo "  $candidate — это каталог свечей, не наш сайт"
              continue
            fi
            if ! printf '%s\n' "$found" | grep -qE '^(index\.html|admin-panel)/?$'; then
              echo "  $candidate — открылась, но на корень сайта не похожа"
              continue
            fi
            echo "  $candidate — подходит: это корень annamanasaryan.com"
            TARGET="$candidate"
            break
          done

          if [ -z "$TARGET" ]; then
            echo "Не нашёл папку сайта annamanasaryan.com на хостинге."
            echo "Нужна FTP-учётка с корнем в public_html — см."
            echo "docs/perenos-paneli-na-hosting.md."
            exit 1
          fi

          echo "Заливаю сайт в $TARGET на $FTP_HOST"
          # --delete здесь НЕТ и быть не должно: в той же папке лежит
          # admin-panel — файлы панели. С --delete первая же выкладка сайта
          # снесла бы панель целиком.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set cmd:fail-exit yes
            set net:max-retries 3
            set net:timeout 30
            mirror -R --parallel=4 --exclude-glob .DS_Store out "$TARGET"
            bye
          LFTP
          echo "Сайт выложен."

          # Выкладка идёт без --delete, поэтому то, что убрано из репозитория,
          # само с хостинга не исчезает. Здесь перечислено то, чего на сайте
          # быть не должно: Word-файлы заказчицы, которые первая интеграция
          # положила в папку сайта, и старые копии папок и роликов под
          # прежними именами. Ошибки «нет такого файла» не страшны — значит,
          # уже убрано.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP || true
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set cmd:fail-exit no
            cd "$TARGET"
            rm -r -f photos/about
            rm -r -f photos/bloom
            rm -r -f photos/product
            rm -f "videos/Мастер-класс-2015(1).mp4"
            rm -f "videos/Мастер-класс-2015(2).mp4"
            rm -f photos/backstage/back-14.MP4
            bye
          LFTP
          echo "Старые файлы убраны."

      - name: Проверить живой сайт после выкладки
        if: steps.check.outputs.ready == 'true'
        run: |
          python3 - <<'EOF'
          import re, html, time, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          site = "https://annamanasaryan.com"
          def get(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={"User-Agent": "deploy-check"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, (r.read() if method == "GET" else b"")
              except urllib.error.HTTPError as e:
                  return e.code, b""
              except Exception as e:
                  return f"ERR {type(e).__name__}", b""
          st, body = get(site + "/sitemap.xml")
          pages = re.findall(r"<loc>([^<]+)</loc>", body.decode("utf8", "ignore"))
          pages = [p.replace("https://www.", "https://") for p in pages] or [site + "/"]
          assets = {}
          for p in pages:
              st, body = get(p)
              text = body.decode("utf8", "ignore")
              n = 0
              for m in re.findall(r'(?:src|href|poster)="([^"]+)"', text):
                  u = html.unescape(m).split("?")[0].split("#")[0]
                  if u.startswith("/") and not u.startswith("//") and re.search(r"\.(jpe?g|png|webp|mp4|mov|webm|js|css)$", u, re.I):
                      assets.setdefault(u, set()).add(p); n += 1
              print(f"{st}  файлов={n:<4} {p}")
          def head(u):
              # Хостинг под нагрузкой после заливки иногда отвечает 404 на один
              # случайный файл; повторяем трижды, прежде чем счесть ссылку битой.
              url = site + (u if "%" in u else urllib.parse.quote(u))
              st = None
              for attempt in range(3):
                  st = get(url, "HEAD")[0]
                  if st == 200: break
                  time.sleep(3)
              return u, st
          with ThreadPoolExecutor(16) as ex:
              results = list(ex.map(head, sorted(assets)))
          bad = [(u, st) for u, st in results if st != 200]
          print(f"Файлов, на которые ссылается сайт: {len(results)}; отвечают 200: {len(results) - len(bad)}; битых: {len(bad)}")
          for u, st in bad:
              print("  БИТАЯ:", st, u, "← со страниц:", ", ".join(sorted(assets[u]))[:160])
          for u in ["/photos/about/Привет.docx", "/photos/about/Манасарян Анна Эдвардовна  07.docx"]:
              st = get(site + urllib.parse.quote(u), "HEAD")[0]
              print(f"  {st}  {u}  ({'убран' if st == 404 else 'ЕЩЁ СКАЧИВАЕТСЯ'})")
          if bad:
              raise SystemExit("На живом сайте есть битые ссылки — см. выше.")
          EOF
